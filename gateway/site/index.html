<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storage</title>
<style>
  :root { color-scheme: light dark; --muted: #6b7280; --ok: #15803d; --missing: #b91c1c; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #8884; }
  td.number { text-align: right; font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .missing { color: var(--missing); } .muted { color: var(--muted); }
</style>
</head>
<body>
<h1>Storage</h1>
<p class="muted" id="summary">Loading...</p>
<p id="parity" class="muted"></p>
<table>
  <thead><tr><th>Drive</th><th>State</th><th>Used</th><th>Size</th></tr></thead>
  <tbody id="drives"></tbody>
</table>
<script>
const gigabytes = bytes => (bytes / 1e9).toFixed(1) + " GB";

function driveRow(drive) {
  const row = document.createElement("tr");
  const cells = [drive.label, drive.mounted ? "mounted" : "missing",
    drive.mounted ? gigabytes(drive.used) : "", drive.mounted ? gigabytes(drive.size) : ""];
  cells.forEach((text, index) => {
    const cell = document.createElement("td");
    cell.textContent = text;
    if (index === 1) cell.className = drive.mounted ? "ok" : "missing";
    if (index > 1) cell.className = "number";
    row.appendChild(cell);
  });
  return row;
}

const when = seconds => seconds ? new Date(seconds * 1000).toLocaleString() : "never";

async function refreshParity() {
  const line = document.getElementById("parity");
  try {
    const parity = await (await fetch("snapraid.json", { cache: "no-store" })).json();
    const parts = [`Last sync ${when(parity.lastSync)} (${parity.lastSyncResult || "none"})`,
      `last scrub ${when(parity.lastScrub)} (${parity.lastScrubResult || "none"})`];
    if (parity.running) parts.push(`running: ${parity.running}`);
    line.textContent = parts.join(", ");
    line.className = parity.refused || parity.lastSyncResult === "failed" ? "missing" : "muted";
    if (parity.refused) line.textContent = `Sync refused: ${parity.refused}. ` + line.textContent;
  } catch {
    line.textContent = "No parity status yet.";
  }
}

async function refresh() {
  refreshParity();
  try {
    const status = await (await fetch("status.json", { cache: "no-store" })).json();
    document.getElementById("summary").textContent = `Held by ${status.node}, updated ${status.updated}`;
    document.getElementById("drives").replaceChildren(...status.drives.map(driveRow));
  } catch {
    document.getElementById("summary").textContent = "No status yet.";
  }
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
