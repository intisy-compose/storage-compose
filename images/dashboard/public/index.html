<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storage</title>
<style>
  :root { color-scheme: light dark; --muted: #6b7280; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --line: #8884; --panel: #8881; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
  h2 { font-size: 1.05rem; margin: 1.8rem 0 .6rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.number { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); }
  .state-healthy { border-color: var(--ok); } .state-degraded { border-color: var(--warn); } .state-stopped { border-color: var(--bad); }
  .panel ul { margin: .3rem 0; padding-left: 1.2rem; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: .8rem 1rem; margin: .8rem 0; }
  .panel p { margin: .3rem 0; }
  button { font: inherit; padding: .3rem .8rem; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; }
  button.danger { border-color: var(--bad); color: var(--bad); }
  input, select { font: inherit; padding: .25rem .4rem; margin: .2rem .4rem .2rem 0; }
  pre { background: var(--panel); padding: .8rem; border-radius: 8px; overflow-x: auto; font-size: 12px; max-height: 24rem; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<h1>Storage</h1>
<div id="array-state" class="panel" hidden></div>
<p id="message" class="muted">Loading...</p>

<h2>Drives</h2>
<div class="scroll">
<table>
  <thead><tr><th>Drive</th><th>Asset</th><th>State</th><th>Device</th><th>Used</th><th>Size</th><th>Health</th></tr></thead>
  <tbody id="drives"></tbody>
</table>
</div>
<div id="problems"></div>

<h2>Parity</h2>
<div class="panel">
  <p id="parity"></p>
  <p id="refused" class="bad"></p>
  <p><button id="sync">Sync now</button> <button id="scrub">Scrub now</button> <button id="sync-anyway" class="danger" hidden>Sync anyway</button></p>
</div>

<h2>Log</h2>
<pre id="log"></pre>

<script>
const gigabytes = bytes => bytes === null ? "" : (bytes / 1e9).toFixed(1) + " GB";
const when = seconds => seconds ? new Date(seconds * 1000).toLocaleString() : "never";

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function healthText(smart) {
  if (!smart) return { text: "no SMART", className: "muted" };
  const parts = [smart.passed ? "passed" : "FAILING"];
  if (smart.temperatureCelsius !== null) parts.push(`${smart.temperatureCelsius} °C`);
  if (smart.reallocatedSectors !== null) parts.push(`${smart.reallocatedSectors} reallocated`);
  if (smart.pendingSectors !== null) parts.push(`${smart.pendingSectors} pending`);
  if (smart.percentageUsed !== null) parts.push(`${smart.percentageUsed}% worn`);
  if (smart.powerOnHours !== null) parts.push(`${smart.powerOnHours} h`);
  return { text: parts.join(", "), className: smart.passed ? "" : "bad" };
}

function assetCell(drive) {
  const cell = element("td");
  if (!drive.asset) return cell;
  const link = element(drive.asset.url ? "a" : "span", drive.asset.asset);
  if (drive.asset.url) link.href = drive.asset.url;
  cell.append(link);
  if (drive.serialMismatch) {
    cell.append(element("div", `holds serial ${drive.serial}, not ${drive.asset.serial}; update array.toml`, "bad"));
  }
  return cell;
}

const conditionText = {
  present: { text: "mounted", className: "ok" },
  dropped: { text: "dropped, waiting", className: "warn" },
  missing: { text: "missing", className: "bad" },
  failing: { text: "failing", className: "bad" },
};

function stateCell(drive, status) {
  if (!status) return element("td", drive.mounted ? "mounted" : "missing", drive.mounted ? "ok" : "bad");
  const shown = conditionText[status.condition];
  const cell = element("td", shown.text, shown.className);
  if (status.detail) cell.append(element("div", status.detail, "muted"));
  return cell;
}

const stateMeaning = {
  healthy: "Every drive is present.",
  degraded: "The share keeps working without the missing files; Kopia and parity syncs wait.",
  stopped: "The share is read-only; Syncthing and Kopia are paused until enough drives are back.",
};

function listPanel(heading, items) {
  const list = element("ul");
  list.append(...items.map(item => element("li", item)));
  return [element("p", heading), list];
}

function showArray(array) {
  const panel = document.getElementById("array-state");
  panel.hidden = !array;
  if (!array) return;
  panel.className = `panel state-${array.state}`;
  const headline = element("p");
  headline.append(element("strong", `The array is ${array.state}`, array.state === "healthy" ? "ok" : array.state === "degraded" ? "warn" : "bad"),
    ` since ${new Date(array.since).toLocaleString()}. ${stateMeaning[array.state]}`);
  const parts = [headline];
  if (array.reasons.length) parts.push(...listPanel("Because:", array.reasons));
  if (array.splitFolders.length) {
    parts.push(...listPanel("Syncthing folders on more than one drive (a lost drive would take part of them):",
      array.splitFolders.map(folder => `${folder.id}: ${folder.drives.join(", ")}`)));
  }
  if (array.pausedFolders.length) parts.push(...listPanel("Syncthing folders paused:", array.pausedFolders));
  panel.replaceChildren(...parts);
}

function driveRow(drive, status) {
  const row = document.createElement("tr");
  const health = healthText(drive.smart);
  const used = drive.sizeBytes === null ? null : drive.sizeBytes - drive.freeBytes;
  const device = drive.mounted ? [drive.model, drive.serial, drive.device].filter(Boolean).join(" · ") : "";
  row.append(
    element("td", drive.label),
    assetCell(drive),
    stateCell(drive, status),
    element("td", device, "muted"),
    element("td", gigabytes(used), "number"),
    element("td", gigabytes(drive.sizeBytes), "number"),
    element("td", health.text, health.className));
  return row;
}

async function post(action, body) {
  const response = await fetch(`api/${action}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body ?? {}) });
  const result = await response.json();
  document.getElementById("message").textContent = response.ok ? `Started ${action}.` : `Refused: ${result.error}`;
  document.getElementById("message").className = response.ok ? "ok" : "bad";
  refresh();
}

function confirmationInput(role) {
  const input = element("input");
  input.placeholder = `type ${role} to confirm`;
  input.size = 22;
  return input;
}

function rebuildForm(drive, candidates) {
  const form = element("div");
  const what = drive.role.startsWith("parity") ? "recompute its parity" : "restore its files from parity";
  form.append(element("p", `Rebuild onto a replacement: the chosen drive is erased, labelled ${drive.label}, and SnapRAID will ${what}, then verify it.`));
  if (candidates.length === 0) {
    form.append(element("p", "Plug in an unused drive to rebuild onto; none is attached.", "muted"));
    return form;
  }
  const select = element("select");
  for (const candidate of candidates) {
    const option = element("option", `${candidate.model} · ${candidate.serial} · ${gigabytes(candidate.size)} · ${candidate.path}`);
    option.value = candidate.path;
    select.append(option);
  }
  const confirm = confirmationInput(drive.role);
  const button = element("button", `Erase and rebuild ${drive.role}`, "danger");
  button.onclick = () => post("rebuild", { role: drive.role, device: select.value, confirm: confirm.value });
  form.append(select, confirm, button);
  return form;
}

function removeForm(drive) {
  const form = element("div");
  form.append(element("p", `Continue without it: ${drive.label} leaves the array for good and the files that were on it are lost. Parity is recomputed without it.`));
  const confirm = confirmationInput(drive.role);
  const button = element("button", `Remove ${drive.role} and lose its files`, "danger");
  button.onclick = () => post("remove", { role: drive.role, confirm: confirm.value });
  form.append(confirm, button);
  return form;
}

function problemText(drive, status) {
  if (status?.condition === "dropped") return `${drive.label} dropped off and is being waited for (${status.detail}); it is checked and mounted again when it returns.`;
  if (status?.condition === "failing") {
    const unplug = drive.mounted ? " Unplug it to rebuild it onto a replacement." : "";
    return `${drive.label} is failing: ${status.detail}. It takes no more writes.${unplug}`;
  }
  if (drive.mounted) return `${drive.label} reports a failing SMART check.`;
  return `${drive.label} is missing. If it is only unplugged, plug it back in; it is checked and mounted again within ten seconds.`;
}

function problemPanel(drive, status, candidates) {
  const panel = element("div", undefined, "panel");
  panel.append(element("p", problemText(drive, status), status?.condition === "dropped" ? "warn" : "bad"));
  if (!drive.mounted && status?.condition !== "dropped") {
    panel.append(rebuildForm(drive, candidates));
    if (drive.role.startsWith("data") && drive.role !== "data1") panel.append(removeForm(drive));
  }
  return panel;
}

function showParity(parity) {
  if (!parity) { document.getElementById("parity").textContent = "No parity status yet."; return; }
  const parts = [`Last sync ${when(parity.lastSync)} (${parity.lastSyncResult || "none"})`,
    `last scrub ${when(parity.lastScrub)} (${parity.lastScrubResult || "none"})`];
  if (parity.lastAction) parts.push(`last action: ${parity.lastAction} (${parity.lastActionResult})`);
  if (parity.running) parts.push(`running now: ${parity.running}`);
  document.getElementById("parity").textContent = parts.join(", ");
  document.getElementById("refused").textContent = parity.refused ? `Sync refused: ${parity.refused}` : "";
  document.getElementById("sync-anyway").hidden = !parity.refused.includes("files deleted");
}

async function refresh() {
  try {
    const state = await (await fetch("api/state", { cache: "no-store" })).json();
    const statusOf = drive => state.array?.drives.find(status => status.label === drive.label);
    showArray(state.array);
    document.getElementById("drives").replaceChildren(...state.drives.map(drive => driveRow(drive, statusOf(drive))));
    const isProblem = drive => !drive.mounted || (drive.smart && drive.smart.passed === false) || (statusOf(drive) && statusOf(drive).condition !== "present");
    const problems = state.drives.filter(isProblem);
    document.getElementById("problems").replaceChildren(...problems.map(drive => problemPanel(drive, statusOf(drive), state.candidates)));
    showParity(state.parity);
    document.getElementById("log").textContent = state.log.join("\n");
    if (document.getElementById("message").textContent === "Loading...") document.getElementById("message").textContent = "";
  } catch {
    document.getElementById("message").textContent = "The dashboard is not answering.";
  }
}

document.getElementById("sync").onclick = () => post("sync");
document.getElementById("scrub").onclick = () => post("scrub");
document.getElementById("sync-anyway").onclick = () => {
  if (confirm("Accept the deleted files and write them into parity? They can no longer be restored afterwards.")) post("sync", { anyway: true });
};
refresh();
setInterval(() => { if (!document.querySelector("input:focus, select:focus")) refresh(); }, 10000);
</script>
</body>
</html>
