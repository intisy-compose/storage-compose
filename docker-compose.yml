# The portable storage array, reachable over Tailscale and on this host's loopback. Start it through
# docker-compose.ps1 (Windows, attaches the enclosures with usbipd first) or docker-compose.sh
# (Linux); both pass --env-file config.env. All state lives on the array, so the drives carry the
# node's identity between hosts.
name: storage

# The scheduler and the dashboard run the same snapraid.sh, sharing its job lock in storage-status.
x-array-jobs: &array-jobs
  restart: unless-stopped
  privileged: true
  environment:
    ARRAY_PREFIX: ${ARRAY_PREFIX:-storage}
    SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-24}
    SCRUB_INTERVAL_DAYS: ${SCRUB_INTERVAL_DAYS:-7}
    SCRUB_PERCENT: ${SCRUB_PERCENT:-8}
    SCRUB_OLDER_THAN_DAYS: ${SCRUB_OLDER_THAN_DAYS:-10}
    SYNC_MAX_DELETED: ${SYNC_MAX_DELETED:-500}
    START_DELAY_SECONDS: ${START_DELAY_SECONDS:-300}
    CANDIDATE_TRANSPORTS: ${CANDIDATE_TRANSPORTS:-usb}
  volumes:
    - /dev:/dev
    - ${STORAGE_ROOT:-/mnt/storage}:/mnt/storage:rslave
    - storage-status:/status
  depends_on:
    mounter:
      condition: service_healthy

services:
  mounter:
    build: images/mounter
    image: storage-mounter:local
    container_name: storage-mounter
    restart: unless-stopped
    privileged: true
    environment:
      STORAGE_NODE: ${STORAGE_NODE:?run init-config}
      ARRAY_PREFIX: ${ARRAY_PREFIX:-storage}
      LOCK_TIMEOUT_SECONDS: ${LOCK_TIMEOUT_SECONDS:-600}
      DROP_GRACE_SECONDS: ${DROP_GRACE_SECONDS:-120}
      SMART_INTERVAL_HOURS: ${SMART_INTERVAL_HOURS:-6}
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
    volumes:
      - /dev:/dev
      - ${STORAGE_ROOT:-/mnt/storage}:/mnt/storage:rshared
      - storage-status:/status
    stop_grace_period: 60s

  pool:
    build: images/pool
    image: storage-pool:local
    container_name: storage-pool
    restart: unless-stopped
    privileged: true
    environment:
      ARRAY_PREFIX: ${ARRAY_PREFIX:-storage}
      POOL_MIN_FREE_SPACE: ${POOL_MIN_FREE_SPACE:-4G}
    volumes:
      - ${STORAGE_ROOT:-/mnt/storage}:/mnt/storage:rshared
      - storage-status:/status:ro
    depends_on:
      mounter:
        condition: service_healthy

  snapraid:
    <<: *array-jobs
    build: images/snapraid
    image: storage-snapraid:local
    container_name: storage-snapraid

  # Anyone on the tailnet can use its actions, the same trust the tailnet gets everywhere else.
  dashboard:
    <<: *array-jobs
    build:
      context: images
      dockerfile: dashboard/Dockerfile
    image: storage-dashboard:local
    container_name: storage-dashboard

  # Owns the network namespace and publishes the local ports, on loopback only, so the local
  # addresses keep working while tailscale restarts or cannot join.
  gateway:
    image: caddy:2.11.4-alpine
    container_name: storage-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8442:8442"
      - "127.0.0.1:8443:8443"
    environment:
      STORAGE_HOST: ${STORAGE_HOST:-storage.invalid}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - tailscale-socket:/var/run/tailscale
      - storage-caddy-data:/data
    depends_on:
      dashboard:
        condition: service_started

  # Joins the gateway's namespace and forwards the tailnet ports to it. The node key lives on the
  # array; TS_AUTHKEY is only needed for the first join.
  tailscale:
    image: tailscale/tailscale:v1.102.4
    container_name: storage-tailscale
    restart: unless-stopped
    network_mode: "service:gateway"
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-storage}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${STORAGE_ROOT:-/mnt/storage}/${ARRAY_PREFIX:-storage}-data1/.storage/tailscale:/var/lib/tailscale
      - ./gateway/serve.json:/config/serve.json:ro
      - tailscale-socket:/var/run/tailscale
    depends_on:
      mounter:
        condition: service_healthy
      gateway:
        condition: service_started
        restart: true

  # Samba and Syncthing share the gateway's namespace, so tailnet ports 445 and 22000 reach them
  # directly through serve.json; only the gateway publishes ports, on loopback.
  samba:
    image: ghcr.io/crazy-max/samba:4.23.8
    container_name: storage-samba
    restart: unless-stopped
    network_mode: "service:gateway"
    environment:
      TZ: ${TIMEZONE:-Europe/Berlin}
    volumes:
      - ./services/samba/config.yml:/data/config.yml:ro
      - samba-data:/data
      - ${STORAGE_ROOT:-/mnt/storage}:/mnt/storage:rslave
      - ${STORAGE_ROOT:-/mnt/storage}/${ARRAY_PREFIX:-storage}-data1/.storage/secrets:/secrets:ro
    depends_on:
      gateway:
        condition: service_started
        restart: true
      pool:
        condition: service_healthy

  syncthing:
    image: ghcr.io/syncthing/syncthing:2.1.6
    container_name: storage-syncthing
    restart: unless-stopped
    network_mode: "service:gateway"
    entrypoint: ["/bin/sh", "/start.sh"]
    environment:
      STGUIADDRESS: 127.0.0.1:8385
      STHOMEDIR: /var/syncthing/config
    # The image's own check probes 8384, which in the shared namespace is Tailscale serve's TLS port.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 2 http://127.0.0.1:8385/rest/noauth/health | grep -q OK"]
      interval: 60s
      timeout: 10s
    volumes:
      - ./services/syncthing/start.sh:/start.sh:ro
      - ./services/syncthing/guard.sh:/guard.sh:ro
      - storage-status:/status:ro
      - ${STORAGE_ROOT:-/mnt/storage}/${ARRAY_PREFIX:-storage}-data1/.storage/syncthing:/var/syncthing/config
      - ${STORAGE_ROOT:-/mnt/storage}/${ARRAY_PREFIX:-storage}-data1/.storage/secrets:/secrets:ro
      - ${STORAGE_ROOT:-/mnt/storage}:/mnt/storage:rslave
    depends_on:
      gateway:
        condition: service_started
        restart: true
      pool:
        condition: service_healthy

  kopia:
    build: images/kopia
    image: storage-kopia:local
    container_name: storage-kopia
    restart: unless-stopped
    volumes:
      - ${STORAGE_ROOT:-/mnt/storage}/pool/kopia:/repository
      - ${STORAGE_ROOT:-/mnt/storage}/${ARRAY_PREFIX:-storage}-data1/.storage/kopia:/state
      - ${STORAGE_ROOT:-/mnt/storage}/${ARRAY_PREFIX:-storage}-data1/.storage/secrets:/secrets:ro
      - kopia-cache:/cache
      - storage-status:/status:ro
    depends_on:
      pool:
        condition: service_healthy

volumes:
  samba-data:
  kopia-cache:
  storage-status:
  storage-caddy-data:
  tailscale-socket:
