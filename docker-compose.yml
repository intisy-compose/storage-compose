# The portable storage array, reachable over Tailscale. Start it through docker-compose.ps1 (Windows,
# attaches the enclosures with usbipd first) or docker-compose.sh (Linux); both pass --env-file
# config.env. All state lives on the array, so the drives carry the node's identity between hosts.
name: storage

# The scheduler and the dashboard run the same snapraid.sh, sharing its job lock in storage-status.
x-array-jobs: &array-jobs
  restart: unless-stopped
  privileged: true
  environment:
    ARRAY_PREFIX: ${ARRAY_PREFIX:-storage}
    SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-24}
    SCRUB_INTERVAL_DAYS: ${SCRUB_INTERVAL_DAYS:-7}
    SYNC_MAX_DELETED: ${SYNC_MAX_DELETED:-500}
    START_DELAY_SECONDS: ${START_DELAY_SECONDS:-300}
    CANDIDATE_TRANSPORTS: ${CANDIDATE_TRANSPORTS:-usb}
  volumes:
    - /dev:/dev
    - ${STORAGE_ROOT:-/mnt/storage}:/mnt/storage:rslave
    - storage-status:/status
  depends_on:
    mounter:
      condition: service_healthy

services:
  mounter:
    build: images/mounter
    image: storage-mounter:local
    container_name: storage-mounter
    restart: unless-stopped
    privileged: true
    environment:
      STORAGE_NODE: ${STORAGE_NODE:?run init-config}
      ARRAY_PREFIX: ${ARRAY_PREFIX:-storage}
      LOCK_TIMEOUT_SECONDS: ${LOCK_TIMEOUT_SECONDS:-600}
    volumes:
      - /dev:/dev
      - ${STORAGE_ROOT:-/mnt/storage}:/mnt/storage:rshared
      - storage-status:/status
    stop_grace_period: 60s

  pool:
    build: images/pool
    image: storage-pool:local
    container_name: storage-pool
    restart: unless-stopped
    privileged: true
    environment:
      ARRAY_PREFIX: ${ARRAY_PREFIX:-storage}
      POOL_MIN_FREE_SPACE: ${POOL_MIN_FREE_SPACE:-4G}
    volumes:
      - ${STORAGE_ROOT:-/mnt/storage}:/mnt/storage:rshared
    depends_on:
      mounter:
        condition: service_healthy

  snapraid:
    <<: *array-jobs
    build: images/snapraid
    image: storage-snapraid:local
    container_name: storage-snapraid

  # Anyone on the tailnet can use its actions, the same trust the tailnet gets everywhere else.
  dashboard:
    <<: *array-jobs
    build:
      context: images
      dockerfile: dashboard/Dockerfile
    image: storage-dashboard:local
    container_name: storage-dashboard

  # Owns the network namespace the gateway shares, and forwards tailnet :443 to Caddy. The node key
  # lives on the array; TS_AUTHKEY is only needed for the first join.
  tailscale:
    image: tailscale/tailscale:v1.102.4
    container_name: storage-tailscale
    hostname: ${TS_HOSTNAME:-storage}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-storage}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${STORAGE_ROOT:-/mnt/storage}/${ARRAY_PREFIX:-storage}-data1/.storage/tailscale:/var/lib/tailscale
      - ./gateway/serve.json:/config/serve.json:ro
      - tailscale-socket:/var/run/tailscale
    depends_on:
      mounter:
        condition: service_healthy

  gateway:
    image: caddy:2.11.4-alpine
    container_name: storage-gateway
    restart: unless-stopped
    network_mode: "service:tailscale"
    environment:
      STORAGE_HOST: ${STORAGE_HOST:-storage.invalid}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - tailscale-socket:/var/run/tailscale
      - storage-caddy-data:/data
    depends_on:
      tailscale:
        condition: service_started
      dashboard:
        condition: service_started

  # Samba and Syncthing share the tailscale namespace, so tailnet ports 445 and 22000 reach them
  # directly through serve.json; the rest of the stack never publishes a port.
  samba:
    image: ghcr.io/crazy-max/samba:4.23.8
    container_name: storage-samba
    restart: unless-stopped
    network_mode: "service:tailscale"
    environment:
      TZ: ${TIMEZONE:-Europe/Berlin}
    volumes:
      - ./services/samba/config.yml:/data/config.yml:ro
      - samba-data:/data
      - ${STORAGE_ROOT:-/mnt/storage}:/mnt/storage:rslave
      - ${STORAGE_ROOT:-/mnt/storage}/${ARRAY_PREFIX:-storage}-data1/.storage/secrets:/secrets:ro
    depends_on:
      tailscale:
        condition: service_started
      pool:
        condition: service_healthy

  syncthing:
    image: ghcr.io/syncthing/syncthing:2.1.6
    container_name: storage-syncthing
    restart: unless-stopped
    network_mode: "service:tailscale"
    entrypoint: ["/bin/sh", "/start.sh"]
    environment:
      STGUIADDRESS: 127.0.0.1:8385
      STHOMEDIR: /var/syncthing/config
    volumes:
      - ./services/syncthing/start.sh:/start.sh:ro
      - ${STORAGE_ROOT:-/mnt/storage}/${ARRAY_PREFIX:-storage}-data1/.storage/syncthing:/var/syncthing/config
      - ${STORAGE_ROOT:-/mnt/storage}/${ARRAY_PREFIX:-storage}-data1/.storage/secrets:/secrets:ro
      - ${STORAGE_ROOT:-/mnt/storage}:/mnt/storage:rslave
    depends_on:
      tailscale:
        condition: service_started
      pool:
        condition: service_healthy

  kopia:
    build: images/kopia
    image: storage-kopia:local
    container_name: storage-kopia
    restart: unless-stopped
    volumes:
      - ${STORAGE_ROOT:-/mnt/storage}/pool/kopia:/repository
      - ${STORAGE_ROOT:-/mnt/storage}/${ARRAY_PREFIX:-storage}-data1/.storage/kopia:/state
      - ${STORAGE_ROOT:-/mnt/storage}/${ARRAY_PREFIX:-storage}-data1/.storage/secrets:/secrets:ro
      - kopia-cache:/cache
    depends_on:
      pool:
        condition: service_healthy

volumes:
  samba-data:
  kopia-cache:
  storage-status:
  storage-caddy-data:
  tailscale-socket:
